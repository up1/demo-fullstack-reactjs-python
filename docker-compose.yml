services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracking_db
      POSTGRES_USER: tracking_user
      POSTGRES_PASSWORD: tracking_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_user -d tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tracking_user:tracking_pass@db:5432/tracking_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
